name: Validate Easy Gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-full-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Extract browser JavaScript and verify feature markers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          server = Path("server.js").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          if not scripts:
              raise SystemExit("No inline browser script found in index.html")
          Path("/tmp/easy-gateway-inline.js").write_text("\n".join(scripts), encoding="utf-8")

          combined = html + "\n" + server
          required = [
              'data-page="expiry"',
              'data-action="restore-expired"',
              "/api/auth/register",
              "loyalty_transactions",
              "runExpirySweep",
              "runAutoPurchaseCycle",
              "recycle_bin",
          ]
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit("Missing full-stack feature markers: " + ", ".join(missing))
          print("Full-stack feature markers are present.")
          PY

      - name: Check backend JavaScript syntax
        run: npm run check

      - name: Check browser JavaScript syntax
        run: node --check /tmp/easy-gateway-inline.js

      - name: Run unit tests
        run: npm test
