services:
  - type: web
    name: easy-gateway
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: easy-gateway-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: easy-gateway-db
    databaseName: easy_gateway_db
    user: easy_gateway_db_user
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    ipAllowList: []
