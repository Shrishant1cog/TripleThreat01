const fmt=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(n)||0);
const num=n=>new Intl.NumberFormat("en-IN",{maximumFractionDigits:2}).format(Number(n)||0);
const safe=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateLabel=v=>{if(!v)return "Not set";const d=new Date(String(v).slice(0,10)+"T00:00:00");return isNaN(d)?safe(v):d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});};
const localDate=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const daysToExpiry=v=>{if(!v)return null;const d=new Date(String(v).slice(0,10)+"T00:00:00"),n=new Date(localDate()+"T00:00:00");return isNaN(d)?null:Math.round((d-n)/86400000);};
let state={user:null,settings:{coinThreshold:100,timezone:"Asia/Kolkata",autoPurchaseEnabled:false,maxAutoPurchaseAmount:5000},products:[],sales:[],customers:[],suppliers:[],recycleBin:[],notifications:[],purchaseOrders:[],dashboard:{revenueToday:0,ordersToday:0,revenueYesterday:0,lowStockCount:0,productCount:0,loyaltyCoins:0,dailySales:[],anomalies:[],lowStockProducts:[]},purchasePlan:{items:[],estimatedTotal:0}};
let page="dashboard",query="",authMode="login",toastTimer=null,knownNotifications=new Set(),busy=false;
async function api(path,options){
 const opts=options||{},headers=Object.assign({},opts.headers||{});
 if(opts.body!==undefined){headers["Content-Type"]="application/json";opts.body=JSON.stringify(opts.body);}
 const response=await fetch("/api"+path,Object.assign({},opts,{headers,credentials:"same-origin"}));
 let data={};try{data=await response.json();}catch(_){}
 if(!response.ok){const err=new Error(data.error||"Request failed ("+response.status+").");err.status=response.status;err.data=data;throw err;}
 return data;
}
function toast(message){const root=$("toastRoot");if(!root)return;root.innerHTML='<div class="toast">'+safe(message)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML="",4200);}

password")+'"></label><button class="btn btn-primary auth-submit" id="authSubmit" type="submit">'+(isRegister?"Create account":"Sign in securely")+'</button></form><div class="auth-switch">'+(isRegister?'Already have an account? <button type="button" data-action="auth-login">Sign in</button>':'New to Easy Gateway? <button type="button" data-action="auth-register">Create a shop account</button>')+'</div><div class="auth-small">Your account uses a server-side session and the shop's records are stored in PostgreSQL. Use a unique password. This project is still an MVP and should be security-reviewed before handling sensitive business data.</div></section></div>';
}
function hideAuth(){document.body.classList.remove("auth-mode");$("authRoot").innerHTML="";}
function markNav(){document.querySelectorAll(".nav-item[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const title=({dashboard:"Store overview",inventory:"Inventory",expiry:"Expiry & recycle bin",sales:"Sales & trends",purchasing:"Purchase planner",suppliers:"Suppliers",customers:"Customers",loyalty:"Loyalty coins",automations:"Automations",settings:"Shop settings"})[page]||"Store overview";$("crumbTitle").textContent=title;if($("lowCount"))$("lowCount").textContent=state.dashboard.lowStockCount||0;if($("expiryCount"))$("expiryCount").textContent=state.recycleBin.length||0;const store=document.querySelector(".store strong");if(store)store.textContent=state.user.shopName;const storeSmall=document.querySelector(".store small");if(storeSmall)storeSmall.textContent="Connected · "+state.user.email;const profile=document.querySelector(".profile strong");if(profile)profile.textContent=state.user.name;const profileSmall=document.querySelector(".profile small");if(profileSmall)profileSmall.textContent=state.user.role+" account";}
async function loadData(){
 const boot=await api("/bootstrap");
 state.user=boot.user;state.settings=boot.settings;state.products=boot.products;state.sales=boot.sales;state.customers=boot.customers;state.suppliers=boot.suppliers;state.recycleBin=boot.recycleBin;state.notifications=boot.notifications;state.purchaseOrders=boot.purchaseOrders;state.dashboard=boot.dashboard;
 try{state.purchasePlan=await api("/purchase-plan");}catch(_){state.purchasePlan={items:[],estimatedTotal:0};}
 state.notifications.forEach(n=>knownNotifications.add(n.id));
 hideAuth();render();
}
async function start(){try{await api("/auth/me");await loadData();}catch(err){if(err.status===401)showAuth("login");else showAuth("login",err.message||"Could not connect to Easy Gateway.");}}
function badge(label,type){return '<span class="badge '+(type||"")+'">'+safe(label)+'</span>';}
function tableEmpty(columns,message){return '<tr><td colspan="'+columns+'" class="empty">'+safe(message)+'</td></tr>';}
function metric(label,value,detail,symbol){return '<article class="metric"><div class="metric-top"><span>'+label+'</span><span class="metric-symbol">'+symbol+'</span></div><div class="metric-value">'+value+'</div><div class="metric-sub">'+detail+'</div></article>';}
function chartSvg(){
 const points=(state.dashboard.dailySales||[]).map(x=>Number(x.revenue)||0),w=660,h=175,pad=14,max=Math.max(1,...points)*1.18;
 const xy=points.map((v,i)=>[points.length<=1?w/2:pad+i*(w-2*pad)/(points.length-1),h-pad-v/max*(h-2*pad)]);
 const coords=xy.map(p=>p[0]+","+p[1]).join(" "),area=xy.length?pad+","+(h-pad)+" "+coords+" "+(w-pad)+","+(h-pad):"";
 let grid="";[0,1,2,3].forEach(i=>{const y=pad+i*(h-2*pad)/3;grid+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="#e9ede5" stroke-dasharray="3 5"/>';});
 return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Actual recorded daily sales">'+grid+(xy.length?'<polygon points="'+area+'" fill="#e8f1e3"/><polyline points="'+coords+'" fill="none" stroke="#477d53" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+xy.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===xy.length-1?4:2.4)+'" fill="'+(i===xy.length-1?"#477d53":"#fff")+'" stroke="#477d53" stroke-width="1.5"/>').join(""):'')+'</svg>';
}
function chartLabels(){return '<div class="chart-labels">'+(state.dashboard.dailySales||[]).map(d=>'<span>'+safe(new Date(d.day+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short"}))+'</span>').join("")+'</div>';}
function renderDashboard(){

 const low=state.products.filter(p=>p.stock<=p.reorderAt).slice(0,3);
 return '<div class="metrics">'+metric("Sales today",fmt(d.revenueToday),'<span class="'+(salesVariance>=0?"positive":"warning")+'">'+(salesVariance>=0?"+":"")+fmt(salesVariance)+'</span> vs yesterday',"₹")+metric("Orders today",num(d.ordersToday),"Recorded sales transactions","▣")+metric("Products to reorder",num(d.lowStockCount),"At or below reorder level","▤")+metric("Loyalty coins",num(d.loyaltyCoins),"Earned by shop customers","◆")+'</div><div class="main-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Sales performance</div><div class="panel-caption">Actual recorded sales · last 7 calendar days</div></div><button class="link-btn" data-page="sales">View sales →</button></div><div class="chart-summary"><div><span class="muted-label">Revenue today</span><strong>'+fmt(d.revenueToday)+'</strong></div><span class="chart-badge">PostgreSQL records</span></div>'+chartSvg()+chartLabels()+'<div class="chart-legend"><span><i class="legend-dot"></i> Actual recorded revenue</span></div><div class="panel-foot"><span>Only sales entered in Easy Gateway are shown.</span><button class="link-btn" data-action="record-sale">Record sale →</button></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Purchase recommendations</div><div class="panel-caption">Rule-based plan using stock, sales history and lead time</div></div>'+badge(picks.length+" items","")+'</div><div class="purchase-summary"><div><small>Estimated order cost</small><strong>'+fmt(plan.reduce((a,p)=>a+p.estimatedCost,0))+'</strong></div><span class="pill-count">Review first</span></div><div class="purchase-list">'+(picks.map(p=>'<div class="purchase-row"><span class="product-initial">'+safe(p.name.charAt(0))+'</span><span class="purchase-copy"><strong>'+safe(p.name)+'</strong><small>'+num(p.stock)+' in stock · suggest '+num(p.quantity)+' '+safe(p.unit)+'</small></span><span class="risk '+(p.stock<=p.reorderAt*.65?"high":"")+'">'+(p.stock<=p.reorderAt*.65?"At risk":"Restock")+'</span></div>').join("")||'<div class="empty">Add products and record sales to generate a buying plan.</div>')+'</div><div class="panel-foot"><span>Draft orders are not sent externally.</span><button class="btn btn-primary" data-page="purchasing">Review plan →</button></div></section></div><div class="bottom-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Unexpected sales changes</div><div class="panel-caption">Compared with the prior 2–3 non-zero days; not an AI forecast</div></div><button class="link-btn" data-page="sales">View log →</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Scope</th><th>Actual / baseline</th><th>Variance</th><th>Status</th></tr></thead><tbody>'+anomalyRows+'</tbody></table></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Needs attention</div><div class="panel-caption">Live inventory checks and notifications</div></div>'+badge(String(low.length+state.notifications.filter(n=>!n.isRead).length),"warn")+'</div>'+(low.map(p=>'<div class="attention-row"><span class="attention-symbol">!</span><span class="attention-copy"><strong>'+safe(p.name)+'</strong><small>Stock '+num(p.stock)+' · reorder at '+num(p.reorderAt)+'</small></span><button class="row-action" data-page="inventory">›</button></div>').join("")||'<div class="attention-row"><span class="attention-copy"><strong>No low-stock alerts</strong><small>Products will appear here when they reach reorder level.</small></span></div>')+'<div class="attention-row"><span class="attention-symbol">♲</span><span class="attention-copy"><strong>'+state.recycleBin.length+' expired product records</strong><small>Review recycle bin and notification history.</small></span><button class="row-action" data-page="expiry">›</button></div></section></div>';
}
function renderInventory(){
 const list=state.products.filter(p=>(p.name+" "+p.sku+" "+p.category).toLowerCase().includes(query.toLowerCase()));

ts stored in PostgreSQL.</div></div><button class="link-btn" data-action="clear-notifications">Mark all read</button></div>'+notices+'</section>';

async function withBusy(button,fn){
 if(busy)return;busy=true;if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent="Working…";}
 try{await fn();}catch(err){if(err.status===401){showAuth("login","Your session expired. Please sign in again.");}else toast(err.message||"Request failed.");}
 finally{busy=false;if(button&&button.isConnected){button.disabled=false;if(button.dataset.originalText)button.textContent=button.dataset.originalText;}}
}

 if(action==="logout"){await withBusy(target,async()=>{await api("/auth/logout",{method:"POST",body:{}});state.user=null;showAuth("login","You have signed out.");});return;}
 if(action==="alerts"){page="expiry";render();toast(state.notifications.filter(n=>!n.isRead).length+" unread notification(s).");return;}
 if(action==="save-coin-rule"){await withBusy(target,async()=>{const value=Math.floor(Number($("coinThreshold").value));if(!Number.isFinite(value)||value<1)throw new Error("Set a valid amount of at least ₹1.");const result=await api("/settings",{method:"PUT",body:{coinThreshold:value,maxAutoPurchaseAmount:state.settings.maxAutoPurchaseAmount,autoPurchaseEnabled:state.settings.autoPurchaseEnabled,timezone:state.settings.timezone}});state.settings=result.settings;await refresh();toast("Loyalty earning rule saved.");});return;}
 if(action==="clear-notifications"){await withBusy(target,async()=>{await api("/notifications",{method:"DELETE",body:{}});await refresh();toast("Notifications marked as read.");});return;}
 if(action==="mark-read"){await withBusy(target,async()=>{await api("/notifications/"+encodeURIComponent(target.dataset.id)+"/read",{method:"POST",body:{}});await refresh();});return;}
 if(action==="enable-notifications"){if(!("Notification" in window)){toast("This browser does not support desktop notifications.");return;}const p=await Notification.requestPermission();toast(p==="granted"?"Browser notifications enabled while the app is open.":"Notification permission was not granted.");return;}
 if(action==="restore-expired"){const row=state.recycleBin.find(x=>x.id===target.dataset.id);if(!row)return;const existing=String(row.expiry||"").slice(0,10);const value=window.prompt("Only restore if the recorded expiry date was wrong. Enter the corrected valid date (YYYY-MM-DD):",existing);if(value===null)return;await withBusy(target,async()=>{await api("/recycle-bin/"+encodeURIComponent(row.id)+"/restore",{method:"POST",body:{expiryDate:value}});await refresh();toast("Product restored after expiry-date correction.");});return;}
 if(action==="delete-recycled"){if(!window.confirm("Remove this record from the recycle-bin view? Its historical record remains on the server."))return;await withBusy(target,async()=>{await api("/recycle-bin/"+encodeURIComponent(target.dataset.id),{method:"DELETE",body:{}});await refresh();toast("Recycle-bin record hidden.");});return;}
 if(action==="receive-po"){if(!window.confirm("Mark the outstanding quantities as received? This updates product stock; it does not contact the supplier."))return;await withBusy(target,async()=>{const r=await api("/purchase-orders/"+encodeURIComponent(target.dataset.id)+"/receive",{method:"POST",body:{}});await refresh();toast("Purchase receipt saved. Status: "+r.status.replaceAll("_"," ")+".");});return;}
});
document.addEventListener("submit",async event=>{
 const form=event.target;event.preventDefault();
 if(form.id==="authForm"){await submitAuth(form);return;}
 if(form.id==="productForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form),payload={name:fd.get("name"),sku:fd.get("sku"),category:fd.get("category"),unit:fd.get("unit"),stock:Number(fd.get("stock")),reorderAt:Number(fd.get("reorderAt")),cost:Number(fd.get("cost")),price:Number(fd.get("price")),leadTimeDays:Number(fd.get("leadTimeDays")),expiry:fd.get("expiry")||null};const r=await api("/products",{method:"POST",body:payload});$("modalRoot").innerHTML="";await refresh();toast(r.recycledImmediately?r.message:"Product saved to PostgreSQL.");});return;}
 if(form.id==="saleForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);const r=await api("/sales",{method:"POST",body:{productId:fd.get("productId"),quantity:Number(fd.get("quantity")),customerName:String(fd.get("customerName")||"").trim()}});$("modalRoot").innerHTML="";await refresh();toast(r.coinsEarned>0?"Sale saved. "+r.coinsEarned+" loyalty coin(s) awarded.":"Sale saved to PostgreSQL.");});return;}
 if(form.id==="supplierForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);await api("/suppliers",{method:"POST",body:{name:fd.get("name"),contactPerson:fd.get("contactPerson"),phone:fd.get("phone"),email:fd.get("email"),categories:fd.get("categories"),leadTimeDays:Number(fd.get("leadTimeDays")),minimumOrderAmount:Number(fd.get("minimumOrderAmount"))}});$("modalRoot").innerHTML="";await refresh();toast("Supplier saved.");});return;}
 if(form.id==="adjustForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);await api("/products/"+encodeURIComponent(form.dataset.id)+"/stock-adjustments",{method:"POST",body:{delta:Number(fd.get("delta")),reason:fd.get("reason")}});$("modalRoot").innerHTML="";await refresh();toast("Stock adjustment saved with an audit notification.");});return;}
 if(form.id==="poForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const items=(state.purchasePlan.items||[]).map(p=>({productId:p.productId,quantity:p.quantity}));const r=await api("/purchase-orders",{method:"POST",body:{supplierId:form.elements.supplierId.value,items}});$("modalRoot").innerHTML="";await refresh();toast("Purchase draft created: "+r.purchaseOrder.id.slice(0,8)+". No external supplier order was sent.");});return;}
 if(form.id==="automationForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);const r=await api("/settings",{method:"PUT",body:{coinThreshold:state.settings.coinThreshold,maxAutoPurchaseAmount:Number(fd.get("maxAutoPurchaseAmount")),autoPurchaseEnabled:fd.get("autoPurchaseEnabled")==="true",timezone:fd.get("timezone")}});state.settings=r.settings;await refresh();toast("Automation policy saved on the server.");});return;}
});
document.addEventListener("input",event=>{
 if(event.target.id==="globalSearch"){query=event.target.value;page="inventory";render();const input=$("inventorySearch");if(input){input.value=query;input.focus();input.setSelectionRange(query.length,query.length);}}
 if(event.target.id==="inventorySearch"){query=event.target.value;const pos=event.target.selectionStart;render();const input=$("inventorySearch");if(input){input.focus();input.setSelectionRange(pos,pos);}}
 if(event.target.closest("#saleForm")&&(event.target.id==="saleQuantity"||event.target.name==="customerName"))updateSalePreview();
 if(event.target.id==="coinThreshold"){const preview=document.querySelector(".example-card .coin-value"),v=Math.floor(Number(event.target.value)||1);if(preview)preview.textContent=Math.floor(499/Math.max(v,1))+" ◆";}
});
document.addEventListener("change",event=>{if(event.target.id==="saleProduct")updateSalePreview();});
document.addEventListener("keydown",event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){event.preventDefault();$("globalSearch").focus();}if(event.key==="Escape")$("modalRoot").innerHTML="";});
async function pollNotifications(){
 if(!state.user||document.hidden)return;
 try{
  const result=await api("/notifications");
  for(const n of result.notifications){if(!knownNotifications.has(n.id)){knownNotifications.add(n.id);if(n.kind==="product_expired"){toast(n.message);if("Notification" in window&&Notification.permission==="granted"){try{new Notification("Easy Gateway: expiry alert",{body:n.message});}catch(_){}}}}}
  state.notifications=result.notifications;
  if(page==="expiry")render();
 }catch(err){if(err.status===401){state.user=null;showAuth("login","Your session expired. Please sign in again.");}}
}
start();
window.setInterval(pollNotifications,60000);
})();
</script>
</body>
</html>
