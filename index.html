  function persist(){localStorage.setItem("easy-gateway-products",JSON.stringify(products));localStorage.setItem("easy-gateway-sales",JSON.stringify(sales));localStorage.setItem("easy-gateway-customers",JSON.stringify(customers));localStorage.setItem("easy-gateway-recycled-products",JSON.stringify(recycledProducts));localStorage.setItem("easy-gateway-expiry-notifications",JSON.stringify(notifications));localStorage.setItem("easy-gateway-coin-rule",JSON.stringify(spendPerCoin));localStorage.setItem("easy-gateway-purchase-orders",JSON.stringify(purchaseOrders))}

  function localISO(date){const d=date||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function expiryDateValue(value){if(!value)return "";if(value==="Today")return localISO();if(value==="Tomorrow"){const d=new Date();d.setDate(d.getDate()+1);return localISO(d)}const s=String(value);if(s.length!==10||s[4]!=="-"||s[7]!=="-")return "";const parts=s.split("-").map(Number),d=new Date(parts[0],parts[1]-1,parts[2]);return d.getFullYear()===parts[0]&&d.getMonth()===parts[1]-1&&d.getDate()===parts[2]?s:""}

  function processExpiredProducts(showToast){const today=localISO(),expired=products.filter(p=>{const e=expiryDateValue(p.expiry);return e&&e<today});if(!expired.length)return 0;const ids=new Set(expired.map(p=>p.id));expired.forEach(p=>{if(!recycledProducts.some(r=>r.id===p.id)){recycledProducts.unshift(Object.assign({},p,{expiry:expiryDateValue(p.expiry),recycledAt:new Date().toISOString(),recycleReason:"Expiry date passed"}));notifyExpiredProduct(p)}});products=products.filter(p=>!ids.has(p.id));persist();if(showToast)toast(expired.length+" expired product(s) moved to the recycle bin. Retailer notification recorded.");return expired.length}

  function renderDashboard(){const low=lowStock(), picks=low.slice(0,4);return '<div class="metrics">'+moneyMetric("Sales today",fmt(todaySales),'<span class="positive">+12.8%</span> vs yesterday',"₹")+moneyMetric("Orders today",number(orderCount),"Recorded and demo transactions","▣")+moneyMetric("Products to reorder",number(low.length),"At or below reorder level","▤")+moneyMetric("Loyalty coins in wallets",number(customers.reduce((a,c)=>a+c.coins,0)),"Across listed customers","◆")+'</div><div class="main-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Sales performance</div><div class="panel-caption">Illustrative trend · last 7 days</div></div><button class="link-btn" data-page="sales">View sales →</button></div><div class="chart-summary"><div><span class="muted-label">Total revenue today</span><strong>'+fmt(todaySales)+'</strong></div><span class="chart-badge">↗ Trending up</span></div>'+salesChart()+'<div class="chart-labels"><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span></div><div class="chart-legend"><span><i class="legend-dot"></i> Actual demo trend</span><span><i class="legend-dot forecast"></i> Graph is sample data</span></div><div class="panel-foot"><span>Demo workspace · not a live POS connection</span><button class="link-btn" data-page="sales">Explore sales →</button></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Purchase recommendations</div><div class="panel-caption">Rule-based replenishment suggestions</div></div>'+badge(picks.length+" items","")+'</div><div class="purchase-summary"><div><small>Estimated order cost</small><strong>'+fmt(picks.reduce((a,p)=>a+suggested(p)*p.cost,0))+'</strong></div><span class="pill-count">Review first</span></div><div class="purchase-list">'+(picks.map(p=>'<div class="purchase-row"><span class="product-initial">'+safe(p.name.charAt(0))+'</span><span class="purchase-copy"><str   function renderExpiry(){const soon=expiringSoon(),bin=recycledProducts.slice();return '<div class="status-box"><strong>Expiry protection is active in this browser</strong><p>Products with a recorded expiry date earlier than today are removed from active inventory and logged in the recycle bin. This prototype keeps notification history in this browser. Desktop notifications can be enabled below; email and push alerts require a backend.</p><div style="margin-top:10px"><button class="btn btn-secondary" data-action="enable-notifications">Enable desktop notifications</button></div></div><div class="section-metrics"><div class="mini"><span>Expiring in 7 days</span><strong>'+soon.length+'</strong><small>Prioritize selling or rotation</small></div><div class="mini"><span>Moved to recycle bin</span><strong>'+bin.length+'</strong><small>Excluded from active inventory</small></div><div class="mini"><span>Expiry notifications</span><strong>'+notifications.length+'</strong><small>Events recorded</small></div><div class="mini"><span>Active product records</span><strong>'+products.length+'</strong><small>Expired items excluded</small></div></div><section class="panel"><div class="panel-head"><div><div class="panel-title">Expiring soon</div><div class="panel-caption">Prioritize batches with the closest expiry date.</div></div>'+badge(soon.length+" items",soon.length?"warn":"")+'</div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Stock</th><th>Expiry date</th><th>Recommended action</th></tr></thead><tbody>'+(soon.map(p=>'<tr><td><strong>'+safe(p.name)+'</strong><span class="subtext">'+safe(p.sku)+'</span></td><td>'+p.stock+' '+safe(p.unit)+'</td><td><strong class="expiry-date '+(daysToExpiry(p.expiry)<=1?"danger":"")+'">'+safe(expiryDateLabel(p.expiry))+'</strong><span class="subtext">'+(daysToExpiry(p.expiry)===0?"Expires today":daysToExpiry(p.expiry)===1?"Expires tomorrow":"Expires in "+daysToExpiry(p.expiry)+" days")+'</span></td><td>'+badge("Rotate or prioritiz   function renderSuppliers(){return '<div class="status-box"><strong>Supplier records are examples</strong><p>No supplier account, live pricing, email, WhatsApp, or electronic purchase-order connection is active in this website prototype.</p></div><section class="panel"><div class="panel-head"><div><div class="panel-title">Supplier directory</div><div class="panel-caption">Illustrative records for the first demo version.</div></div></div><div class="table-wrap"><table><thead><tr><th>Supplier</th><th>Categories</th><th>Lead time</th><th>Payment terms</th><th>Order channel</th><th>Status</th></tr></thead><tbody><tr><td><strong>Northline Provisions</strong><span class="subtext">SUP-001 · Bengaluru</span></td><td>Staples, grains</td><td>2 days</td><td>7 days</td><td>Manual</td><td>'+badge("Example","")+'</td></tr><tr><td><strong>Fresh Daily Distributors</strong><span class="subtext">SUP-002 · Local delivery</span></td><td>Dairy, eggs</td><td>Same day</td><td>Cash on delivery</td><td>Phone / WhatsApp</td><td>'+badge("Example","")+'</td></tr><tr><td><strong>Homebase Wholesale</strong><span class="subtext">SUP-003 · Regional</span></td><td>Household</td><td>3 days</td><td>15 days</td><td>Email</td><td>'+badge("Example","")+'</td></tr></tbody></table></div></section>'}
  function renderCustomers(){return '<div class="section-metrics"><div class="mini"><span>Customer wallets</span><strong>'+customers.length+'</strong><small>Seeded demo plus new entries</small></div><div class="mini"><span>Returning customers</span><strong>42%</strong><small>Illustrative rate</small></div><div class="mini"><span>Total customer spend</span><strong>'+fmt(customers.reduce((a,c)=>a+c.spend,0))+'</strong><small>Across displayed sample wallets</small></div><div class="mini"><span>Loyalty coins</span><strong>'+number(customers.reduce((a,c)=>a+c.coins,0))+'</strong><small>Current wallet balances</small></div></div><section class="panel"><div class="panel-head"><div><div class="panel-title">Customer directory</div><div class="panel-caption">Avoid collecting personal information you do not need.</div></div><button class="btn btn-primary" data-page="loyalty">Manage loyalty →</button></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Customer ID</th><th>Orders</th><th>Lifetime spend</th><th>Coin balance</th><th>Tier</th></tr></thead><tbody>'+(customers.map(c=>'<tr><td><strong>'+safe(c.name)+'</strong></td><td>'+safe(c.id)+'</td><td>'+c.orders+'</td><td>'+fmt(c.spend)+'</td><td><strong class="coin-cell">'+number(c.coins)+'</strong></td><td>'+badge(c.coins>=100?"Gold":c.coins>=25?"Silver":"Starter",c.coins>=100?"":c.coins>=25?"":"neutral")+'</td></tr>').join("")||tableEmpty(6,"Customer accounts are created when a named sale is recorded."))+'</tbody></table></div></section>'}
  function renderLoyalty(){const total=customers.reduce((a,c)=>a+c.coins,0),earned=sales.reduce((a,s)=>a+(s.coinsEarned||0),0);return '<div class="status-box"><strong>Customer loyalty coins are active in this demo</strong><p>Default rule: 1 coin for every ₹'+spendPerCoin+' spent on each product line, rounded down. Enter a customer name when recording a sale. Coins are points, not cash; redemption and refund reversals need a backend ledger before production.</p></div><div class="section-metrics"><div class="mini"><span>Customer accounts</span><strong>'+customers.length+'</strong><small>Saved in this browser</small></div><div class="mini"><span>Coins in wallets</span><strong>'+number(total)+'</strong><small>Across listed customers</small></div><div class="mini"><span>Coins in sale history</span><strong>'+number(earned)+'</strong><small>Example + recorded transactions</small></div><div class="mini"><span>Earn rate</span><strong>1 / ₹'+spendPerCoin+'</strong><small>Per product line</small></div></div><div class="loyalty-layout"><section class="panel"><div class="panel-head"><div><div class="panel-title">Customer coin wallets</div><div class="panel-caption">Balances update when named customer sales are recorded.</div></div>'+badge("Earning enabled","")+'</div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Lifetime spend</th><th>Orders</th><th>Coin balance</th><th>Tier</th></tr></thead><tbody>'+(customers.slice().sort((a,b)=>b.coins-a.coins).map(c=>'<tr><td><strong>'+safe(c.name)+'</strong><span class="subtext">'+safe(c.id)+'</span></td><td>'+fmt(c.spend)+'</td><td>'+c.orders+'</td><td><strong class="coin-cell">'+number(c.coins)+'</strong></td><td>'+badge(c.coins>=100?"Gold":c.coins>=25?"Silver":"Starter",c.coins>=100?"":c.coins>=25?"":"neutral")+'</td></tr>').join("")||tableEmpty(5,"Record a sale with a customer name to create a wallet."))+'</tbody></table></div></section><section class="panel rule-panel"><div class="panel-head" style="padding:0 0 14px"><div><div class="panel-title">Coin earning rule</div><div class="panel-caption">Set the spend required for one coin.</div></div></div><label class="field">₹ spent per coin<input type="number" min="1" step="1" id="coinThreshold" value="'+spendPerCoin+'"></label><div class="example-card"><small>Example product-line purchase</small><strong>₹499</strong><div class="coin-equation"><span>Estimated coins</span><b class="coin-value">'+Math.floor(499/spendPerCoin)+' ◆</b></div></div><p class="panel-caption" style="line-height:1.7;margin:0 0 15px">Coins are rounded down per product line. Anonymous sales receive no coins. Name matching is case-insensitive within this browser.</p><button class="btn btn-primary" data-action="save-coin-rule">Save earning rule</button></section></div><section class="panel"><div class="panel-head"><div><div class="panel-title">Recent coin activity</div><div class="panel-caption">Recorded sales that earned loyalty coins.</div></div></div><div class="table-wrap"><table><thead><tr><th>Sale ID</th><th>Product</th><th>Customer</th><th>Sale total</th><th>Coins awarded</th><th>Time</th></tr></thead><tbody>'+(sales.filter(s=>(s.coinsEarned||0)>0).slice(0,10).map(s=>'<tr><td><strong>'+safe(s.id)+'</strong></td><td>'+safe(s.item)+'</td><td>'+safe(s.customer)+'</td><td>'+fmt(s.amount)+'</td><td><strong class="coin-cell">+'+s.coinsEarned+'</strong></td><td>'+safe(s.time)+'</td></tr>').join("")||tableEmpty(6,"No coin activity recorded yet."))+'</tbody></table></div></section>'}
  function renderAutomations(){return '<div class="status-box"><strong>Automation is shown as a control plan, not a live background worker</strong><p>Low-stock rules are calculated in the browser. Forecast jobs, email alerts, purchase policy enforcement, and supplier API calls are not connected yet.</p></div><section class="panel"><div class="panel-head"><div><div class="panel-title">Automation rules</div><div class="panel-caption">Production actions must be enforced server-side before use.</div></div></div><div class="attention-row"><span class="attention-symbol">✓</span><span class="attention-copy"><strong>Low-stock detection</strong><small>Active in this demo; checks reorder thresholds.</small></span>'+badge("Local","")+'</div><div class="attention-row"><span class="attention-symbol">↗</span><span class="attention-copy"><strong>Sales anomaly detection</strong><small>Sample entries only; live forecasting not connected.</small></span>'+badge("Planned","warn")+'</div><div class="attention-row"><span class="attention-symbol">◆</span><span class="attention-copy"><strong>Loyalty coin awards</strong><small>Applied when a named sale is recorded.</small></span>'+badge("Local","")+'</div><div class="attention-row"><span class="attention-symbol">!</span><span class="attention-copy"><strong>Autonomous purchasing</strong><small>Disabled until supplier APIs, spend caps, and audit logs exist.</small></span>'+badge("Disabled","warn")+'</div></section>'}
  function renderSettings(){return '<div class="status-box"><strong>This is a frontend prototype</strong><p>Shop settings and records are stored only in this browser. Do not enter sensitive customer details or rely on it for real inventory decisions.</p></div><section class="panel"><div class="panel-head"><div><div class="panel-title">Integrations</div><div class="panel-caption">Connection points are listed for planning, not live connectivity.</div></div></div><div class="attention-row"><span class="attention-symbol">S</span><span class="attention-copy"><strong>SAP inventory</strong><small>Optional. Requires the retailer’s specific SAP product, API access, and credentials.</small></span>'+badge("Not connected","neutral")+'</div><div class="attention-row"><span class="attention-symbol">▣</span><span class="attention-copy"><strong>POS / billing</strong><small>Import and supported POS integrations are planned; sales currently use a demo form.</small></span>'+badge("Not connected","warn")+'</div><div class="attention-row"><span class="attention-symbol">⇄</span><span class="attention-copy"><strong>Supplier ordering</strong><small>No order is transmitted to an external supplier.</small></span>'+badge("Not connected","neutral")+'</div><div class="attention-row"><span class="attention-symbol">◆</span><span class="attention-copy"><strong>Loyalty earning rule</strong><small>Currently '+spendPerCoin+' rupees per coin, stored in browser localStorage.</small></span><button class="btn btn-secondary" data-page="loyalty">Configure</button></div></section>'}
  function render(){processExpiredProducts(false);const meta=titles[page]||titles.dashboard;document.getElementById("crumbTitle").textContent=meta[0];document.querySelectorAll(".nav-item[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("lowCount").textContent=lowStock().length;const expiryCount=document.getElementById("expiryCount");if(expiryCount)expiryCount.textContent=recycledProducts.length;let body=page==="dashboard"?renderDashboard():page==="inventory"?renderInventory():page==="expiry"?renderExpiry():page==="sales"?renderSales():page==="purchasing"?renderPurchasing():page==="suppliers"?renderSuppliers():page==="customers"?renderCustomers():page==="loyalty"?renderLoyalty():page==="automations"?renderAutomations():renderSettings();document.getElementById("content").innerHTML='<div class="heading"><div><div class="eyebrow">YOUR SHOP, AT A GLANCE</div><h1>'+meta[0]+'</h1><p>'+meta[1]+'</p></div><div class="heading-actions"><span class="demo">Demo data</span>'+(page==="dashboard"||page==="sales"?'<button class="btn btn-primary" data-action="record-sale">+ Record sale</button>':page==="inventory"?'<button class="btn btn-primary" data-action="add-product">+ Add product</button>':"")+'</div></div>'+body+'<footer class="footer"><span>© 2026 Easy Gateway</span><span>·</span><span>Built for independent retailers</span><span class="footer-spacer"></span><span><i class="footer-dot"></i>Local demo workspace</span><span>v0.2.0</span></footer>'}
  function openModal(type){const root=document.getElementById("modalRoot");if(type==="product"){root.innerHTML='<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">EASY GATEWAY</div><h2>Add a product</h2><p>Basic details are enough to start tracking stock.</p></div><button class="icon-btn" data-action="close-modal" aria-label="Close">×</button></div><form class="form-grid" id="productForm"><label class="field span">Product name<input name="name" required placeholder="e.g. Stainless steel bottle"></label><label class="field">SKU / barcode<input name="sku" placeholder="Optional"></label><label class="field">Category<select name="category"><option>General retail</option><option>Grocery</option><option>Clothing</option><option>Electronics</option><option>Household</option><option>Stationery</option><option>Personal care</option><option>Food & beverage</option></select></label><label class="field">Unit / pack<input name="unit" required value="piece"></label><label class="field">Current stock<input name="stock" type="number" min="0" step="1" required value="0"></label><label class="field">Reorder at<input name="reorderAt" type="number" min="0" step="1" required value="5"></label><label class="field">Unit cost (₹)<input name="cost" type="number" min="0" step=".01" required value="0"></label><label class="field">Selling price (₹)<input name="price" type="number" min="0" step=".01" required value="0"></label><label class="field span">Expiry date (optional)<input name="expiry" type="date"></label><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Add product</button></div></form></section></div>'}
    else{if(!products.length){toast("Add a product before recording a sale.");return}root.innerHTML='<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">EASY GATEWAY</div><h2>Record a sale</h2><p>Stock and loyalty balances update in this browser.</p></div><button class="icon-btn" data-action="close-modal" aria-label="Close">×</button></div><form class="form-grid" id="saleForm"><label class="field span">Product<select name="productId" id="saleProduct">'+products.map(p=>'<option value="'+safe(p.id)+'">'+safe(p.name)+' · '+p.stock+' in stock · '+fmt(p.price)+'</option>').join("")+'</select></label><label class="field span">Customer name (optional)<input name="customer" placeholder="Name the customer to earn loyalty coins"></label><label class="field span">Quantity sold<input name="quantity" id="saleQuantity" type="number" min="1" step="1" max="'+products[0].stock+'" required value="1"></label><div class="sale-summary"><span>Sale total</span><strong id="saleTotal">'+fmt(products[0].price)+'</strong></div><div class="coin-preview"><span>◆</span><span id="coinEstimate">Named customers earn about '+Math.floor(products[0].price/spendPerCoin)+' coins</span><strong id="coinCount">'+Math.floor(products[0].price/spendPerCoin)+' coins</strong></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Record sale</button></div></form></section></div>';updateSalePreview()}
  }
  function closeModal(){document.getElementById("modalRoot").innerHTML=""}
  function updateSalePreview(){const form=document.getElementById("saleForm");if(!form)return;const p=products.find(x=>x.id===form.productId.value);if(!p)return;const qty=Math.max(1,Number(form.quantity.value)||1),amount=p.price*qty,named=form.customer.value.trim().length>0,coins=named?Math.floor(amount/spendPerCoin):0;document.getElementById("saleQuantity").max=String(p.stock);document.getElementById("saleTotal").textContent=fmt(amount);document.getElementById("coinEstimate").textContent=named?"Estimated coins for this product line":"Enter a customer name to award coins";document.getElementById("coinCount").textContent=coins+" coins"}
  function recordSale(form){const fd=new FormData(form),p=products.find(x=>x.id===fd.get("productId")),qty=Math.floor(Number(fd.get("quantity"))),name=String(fd.get("customer")||"").trim();if(!p||!Number.isInteger(qty)||qty<1||qty>p.stock){toast("Sale was not recorded. Check the available stock and quantity.");return}const amount=p.price*qty,customerName=name||"Walk-in customer",coins=name?Math.floor(amount/spendPerCoin):0;products=products.map(x=>x.id===p.id?Object.assign({},x,{stock:x.stock-qty}):x);todaySales+=amount;orderCount+=1;const sale={id:"EG-"+(Math.floor(2085+Math.random()*9000)),item:p.name+(qty>1?" × "+qty:""),customer:customerName,amount:amount,time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),status:"Paid",coinsEarned:coins};sales.unshift(sale);if(name){const existing=customers.find(c=>c.name.toLowerCase()===name.toLowerCase());if(existing)customers=customers.map(c=>c.id===existing.id?Object.assign({},c,{coins:c.coins+coins,spend:c.spend+amount,orders:c.orders+1}):c);else customers.unshift({id:"EG-C"+String(Date.now()).slice(-5),name:name,coins:coins,spend:amount,orders:1,contact:"Not set"})}persist();closeModal();render();toast(coins>0?"Sale saved. "+coins+" loyalty coins awarded to "+customerName+".":name?"Sale saved. No coins earned for this product line at the current rule.":"Sale saved. Add a customer name to award loyalty coins.")}
  function addProduct(form){const fd=new FormData(form),name=String(fd.get("name")||"").trim();if(!name)return;const product={id:"p"+Date.now(),name:name,sku:String(fd.get("sku")||"").trim()||"EG-"+String(Date.now()).slice(-5),category:String(fd.get("category")||"General retail"),unit:String(fd.get("unit")||"piece"),stock:Math.max(0,Number(fd.get("stock"))||0),reorderAt:Math.max(0,Number(fd.get("reorderAt"))||0),cost:Math.max(0,Number(fd.get("cost"))||0),price:Math.max(0,Number(fd.get("price"))||0),expiry:String(fd.get("expiry")||"")};products.unshift(product);processExpiredProducts(false);persist();closeModal();const movedToRecycle=!products.some(p=>p.id===product.id);page=movedToRecycle?"expiry":"inventory";render();toast(movedToRecycle?name+" was already expired and moved to the recycle bin. Retailer notification recorded.":name+" added to inventory.")}
  function exportCsv(){const head=["Product","SKU","Category","Unit","Stock","Reorder at","Unit cost","Selling price"];const rows=products.map(p=>[p.name,p.sku,p.category,p.unit,p.stock,p.reorderAt,p.cost,p.price]);const csv=[head,...rows].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"})),a=document.createElement("a");a.href=url;a.download="easy-gateway-inventory.csv";a.click();URL.revokeObjectURL(url)}
  document.addEventListener("click",function(event){const target=event.target.closest("button,[data-action]");if(!target)return;if(target.dataset.page){setPage(target.dataset.page);return}const action=target.dataset.action;if(action==="record-sale"){openModal("sale")}else if(action==="add-product"){openModal("product")}else if(action==="close-modal"){closeModal()}else if(action==="backdrop-close"&&event.target===target){closeModal()}else if(action==="export"){exportCsv();toast("Inventory CSV exported.")}else if(action==="create-po"){purchaseOrders++;persist();render();toast("Draft PO-"+(1048+purchaseOrders-1)+" created. No supplier was contacted.")}else if(action==="save-coin-rule"){const input=document.getElementById("coinThreshold"),value=Math.floor(Number(input&&input.value));if(!Number.isFinite(value)||value<1){toast("Set a valid spend amount of at least ₹1.");return}spendPerCoin=value;persist();render();toast("Coin earning rule saved: 1 coin per ₹"+spendPerCoin+" per product line.")}else if(action==="alerts"){page="expiry";render();toast(recycledProducts.length+" expired product(s) in the recycle bin; "+notifications.length+" expiry notifications recorded.")}else if(action==="enable-notifications"){if(!("Notification" in window)){toast("This browser does not support desktop notifications.");return}Notification.requestPermission().then(permission=>{toast(permission==="granted"?"Desktop expiry notifications enabled.":"Browser notification permission was not granted.")})}else if(action==="restore-expired"){const p=recycledProducts.find(x=>x.id===target.dataset.id);if(!p)return;const corrected=window.prompt("Enter the corrected expiry date (YYYY-MM-DD). Do not restore product that is genuinely expired.",p.expiry||"");if(corrected===null)return;const iso=expiryDateValue(corrected);if(!iso||iso<localISO()){toast("Restore blocked. Enter a valid expiry date today or later.");return}const restored=Object.assign({},p,{expiry:iso});delete restored.recycledAt;delete restored.recycleReason;recycledProducts=recycledProducts.filter(x=>x.id!==p.id);products.unshift(restored);notifications.unshift({id:"RESTORE-"+Date.now(),productId:p.id,productName:p.name,message:p.name+" was restored after its expiry date was corrected to "+expiryDateLabel(iso)+".",createdAt:new Date().toISOString(),type:"restored"});persist();render();toast(p.name+" restored after correcting the expiry date.")}else if(action==="delete-recycled"){const p=recycledProducts.find(x=>x.id===target.dataset.id);if(!p)return;if(!window.confirm("Permanently delete "+p.name+" from the recycle bin? This cannot be undone."))return;recycledProducts=recycledProducts.filter(x=>x.id!==p.id);persist();render();toast(p.name+" permanently removed from the demo recycle bin.")}else if(action==="clear-expiry-notifications"){if(!notifications.length){toast("Notification log is already empty.");return}if(!window.confirm("Clear the notification log? Recycle bin records remain."))return;notifications=[];persist();render();toast("Expiry notification log cleared.")}else if(action==="store"){toast("Multi-shop accounts are planned; this is a single local demo workspace.")}});
  document.addEventListener("submit",function(event){if(event.target.id==="productForm"){event.preventDefault();addProduct(event.target)}if(event.target.id==="saleForm"){event.preventDefault();recordSale(event.target)}});
  document.addEventListener("input",function(event){if(event.target.id==="inventorySearch"){query=event.target.value;const start=event.target.selectionStart;render();const next=document.getElementById("inventorySearch");if(next){next.focus();next.setSelectionRange(start,start)}}if(event.target.id==="globalSearch"){query=event.target.value;if(query){page="inventory";render();const next=document.getElementById("inventorySearch");if(next){next.value=query;next.focus()}}}if(event.target.closest("#saleForm")&&(event.target.id==="saleQuantity"||event.target.name==="customer"||event.target.id==="saleProduct"))updateSalePreview()});
  document.addEventListener("change",function(event){if(event.target.id==="saleProduct")updateSalePreview()});
  document.addEventListener("keydown",function(event){if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){event.preventDefault();document.getElementById("globalSearch").focus()}if(event.key==="Escape")closeModal()});
  migrateLegacyExpiryDates();processExpiredProducts(true);persist();render();
  window.setInterval(function(){if(processExpiredProducts(true)>0)render()},60000);
})();
