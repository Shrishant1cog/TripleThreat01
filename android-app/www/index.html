async function handleScannedValue(raw,options){
 const parsed=parseQrValue(raw),opts=options||{};
 if(parsed.error){
  if(window.EGFeatures&&typeof window.EGFeatures.handleScannedCode==="function"&&window.EGFeatures.handleScannedCode(raw))return true;
  toast(parsed.error);return false;
 }
 if(parsed.kind==="store"){
  if(opts.fromLaunch){customerView=true;customerStoreSlug=parsed.slug;return true;}
  await enterCustomerStore(parsed.slug);return true;
 }
 if(parsed.kind==="scan"){await openInAppBrowser(parsed.url);return true;}
 if(parsed.kind==="import"){
  if(parsed.demoOnly===false&&demoMode){
   toast("This is a live import QR. Demo Mode is on, so nothing was changed. Turn Demo Mode off and sign in to import it.");
   return true;
  }
  if(parsed.demoOnly===true&&!demoMode){
   setPendingScanToken(parsed.token,true);
   await enterDemoModeForQr();
   if(opts.fromLaunch)return true;
   toast("Demo Mode on. This QR imports into sample data only.");
   await consumePendingScanToken();return true;
  }
  setPendingScanToken(parsed.token,parsed.demoOnly);
  if(opts.fromLaunch)return true;
  if(demoMode){await consumePendingScanToken();return true;}
  if(!state.user){showAuth("login","Sign in to import the scanned product. It will be added automatically after you sign in.");return true;}
  await consumePendingScanToken();return true;
 }
 return false;
}

  }

  setPendingScanToken("");page="inventory";query="";await loadData();

function defaultExpiryReportRange(){
 const today=localDate(),d=new Date(today+"T00:00:00"),from=new Date(d.getFullYear(),d.getMonth()-11,1);
 const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
 return {from:iso(from),to:today};
}
async function loadExpiryWasteReport(from,to){
 const defaults=defaultExpiryReportRange();
 state.expiryWasteFrom=from||state.expiryWasteFrom||defaults.from;
 state.expiryWasteTo=to||state.expiryWasteTo||defaults.to;
 state.expiryWasteLoading=true;state.expiryWasteError="";state.expiryWasteReport=null;
 if(page==="waste")render();
 try{
  const result=await api("/reports/expiry-waste?from="+encodeURIComponent(state.expiryWasteFrom)+"&to="+encodeURIComponent(state.expiryWasteTo));
  state.expiryWasteReport=result;state.expiryWasteFrom=result.from;state.expiryWasteTo=result.to;
 }catch(err){state.expiryWasteError=err.message||"Could not load the expiry waste report.";}
 finally{state.expiryWasteLoading=false;if(page==="waste")render();}
}

 const monthRows=monthly.slice().reverse().map(m=>'<tr><td><strong>'+safe(monthLabel(m.month))+'</strong></td><td>'+num(m.records)+'</td><td>'+num(m.quantity)+'</td><td>'+fmt(m.estimatedLoss)+'</td><td>'+num(m.recordedRecords)+'</td><td>'+num(m.recordedQuantity)+'</td><td>'+fmt(m.recordedLoss)+'</td></tr>').join("")||tableEmpty(7,"No monthly waste records.");

 $("modalRoot").innerHTML='<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">PURCHASING</div><h2>Create purchase draft</h2><p>Creates an internal draft only. Nothing is sent to the supplier.</p></div><button class="icon-btn" data-action="close-modal">×</button></div><form id="poForm" class="form-grid"><label class="field span">Supplier<select name="supplierId"><option value="">Not assigned</option>'+state.suppliers.map(s=>'<option value="'+safe(s.id)+'">'+safe(s.name)+'</option>').join("")+'</select></label><div class="sale-summary"><span>'+items.length+' product lines</span><strong>'+fmt(state.purchasePlan.estimatedTotal)+'</strong></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit">Create draft order</button></div></form></section></div>';
}
async function refresh(){
 const b=await api("/bootstrap");state.user=b.user;state.settings=b.settings;state.products=b.products;state.sales=b.sales;state.customers=b.customers;state.suppliers=b.suppliers;state.recycleBin=b.recycleBin;state.notifications=b.notifications;state.purchaseOrders=b.purchaseOrders;state.dashboard=b.dashboard;
 try{state.purchasePlan=await api("/purchase-plan");}catch(_){}
 try{state.customerOrders=(await api("/customer-orders")).orders||[];}catch(_){}
 render();
}
async function withBusy(button,fn){
 if(busy)return;busy=true;if(button){button.disabled=true;button.dataset.originalText=button.textContent;button.textContent="Working…";}
 try{await fn();}catch(err){if(err.status===401){showAuth("login","Your session expired. Please sign in again.");}else toast(err.message||"Request failed.");}
 finally{busy=false;if(button&&button.isConnected){button.disabled=false;if(button.dataset.originalText)button.textContent=button.dataset.originalText;}}
}
async function exportCsv(){
 const rows=[["Product","SKU","Category","Unit","Stock","Reorder at","Unit cost","Selling price","Expiry"],...state.products.map(p=>[p.name,p.sku,p.category,p.unit,p.stock,p.reorderAt,p.cost,p.price,p.expiry])];
 await saveCsvFile("easy-gateway-inventory.csv",window.EGCore.csv(rows),"Inventory CSV exported.");
}
async function submitAuth(form){
 const fd=new FormData(form),submit=$("authSubmit");submit.disabled=true;submit.textContent="Working…";
 try{
  const endpoint=authMode==="register"?"/auth/register":"/auth/login";
  const body={email:String(fd.get("email")||""),password:String(fd.get("password")||"")};
  if(authMode==="register"){body.fullName=String(fd.get("fullName")||"");body.shopName=String(fd.get("shopName")||"");}
  await api(endpoint,{method:"POST",body});await loadData();await consumePendingScanToken();if(page==="qr"&&launchGenerateQr&&!state.qr)await generateSampleProductQr(false);toast(authMode==="register"?"Shop account created. Add your first product to begin.":"Signed in successfully.");
 }catch(err){const el=$("authError");if(el){el.textContent=err.message;el.classList.add("show");}}
 finally{if($("authSubmit")){$("authSubmit").disabled=false;$("authSubmit").textContent=authMode==="register"?"Create account":"Sign in securely";}}
}
document.addEventListener("click",async event=>{
 const target=event.target.closest("button,[data-action]");if(!target)return;
 if(target.dataset.customerAdd){const id=target.dataset.customerAdd,existing=customerCart.find(x=>x.productId===id);if(existing)existing.quantity=Math.min(100,existing.quantity+1);else customerCart.push({productId:id,quantity:1});renderCustomerPortal();return;}
 if(target.dataset.customerRemove){const id=target.dataset.customerRemove,existing=customerCart.find(x=>x.productId===id);if(existing){existing.quantity--;if(existing.quantity<=0)customerCart=customerCart.filter(x=>x.productId!==id);}customerOrderKey=null;renderCustomerPortal();return;}
 if(target.dataset.customerInc){const id=target.dataset.customerInc,existing=customerCart.find(x=>x.productId===id);if(existing)existing.quantity=Math.min(100,existing.quantity+1);customerOrderKey=null;renderCustomerPortal();return;}
 if(target.dataset.customerDelete){customerCart=customerCart.filter(x=>x.productId!==target.dataset.customerDelete);customerOrderKey=null;renderCustomerPortal();return;}
 if(target.dataset.page==="qr"){setNavOpen(false);openQrTab();return;}if(target.dataset.page){setNavOpen(false);goToPage(target.dataset.page);return;}
 const action=target.dataset.action;
 if(action==="toggle-nav"){setNavOpen(!document.body.classList.contains("nav-open"));return;}
 if(action==="page-back"){setNavOpen(false);goBackPage();return;}
 if(action==="scan-qr"){setNavOpen(false);await scanQrCode();return;}
 if(action==="save-qr"){await saveQrImage();return;}
 if(action==="edit-product"){openEditProductModal(target.dataset.id);return;}
 if(action==="inventory-filter"){state.inventoryFilter=target.dataset.filter||"all";render();return;}
 if(action==="customer-exit"){exitCustomerStore();return;}
 if(action==="customer-share"){await shareStoreLink();return;}
 if(action==="test-connection"){await testConnection();return;}
 if(action==="toggle-demo"){await toggleDemoMode();return;}
 if(action==="open-qr-tab"){openQrTab();return;}
 if(action==="customer-store"){openCustomerTab();return;}
 if(action==="customer-track"){const panel=$("customerTrackPanel"),form=$("customerTrackForm");if(!panel)return;if(form&&!form.elements.reference.value&&customerLastOrder&&customerLastOrder.reference)form.elements.reference.value=customerLastOrder.reference;panel.scrollIntoView({behavior:"smooth",block:"center"});if(form&&form.elements.reference)setTimeout(()=>form.elements.reference.focus({preventScroll:true}),250);return;}
 if(action==="customer-track-refresh"){const form=$("customerTrackForm");await loadCustomerTracking(form?form.elements.reference.value:customerTrackQuery&&customerTrackQuery.reference,form?form.elements.phone.value:customerTrackQuery&&customerTrackQuery.phone);return;}
 if(action==="store"){page="settings";render();return;}
 if(action==="generate-qr"){await generateSampleProductQr(true);return;}
 if(action==="remove-demo-product"){await withBusy(target,async()=>{await api("/products/"+encodeURIComponent(target.dataset.id)+"/demo",{method:"DELETE",body:{}});await refresh();toast("QR sample removed from inventory.");});return;}
 if(action==="refresh"){await refresh();return;}
 if(action==="customer-order-status"){await withBusy(target,async()=>{await api("/customer-orders/"+encodeURIComponent(target.dataset.id)+"/status",{method:"PUT",body:{status:target.dataset.status}});await refresh();toast("Customer request "+target.dataset.status+".");});return;}
 if(action==="auth-register"){showAuth("register");return;}
 if(action==="auth-login"){showAuth("login");return;}
 if(action==="close-modal"){ $("modalRoot").innerHTML="";return;}
 if(action==="backdrop-close"&&event.target===target){$("modalRoot").innerHTML="";return;}
 if(action==="record-sale"){if(window.EGFeatures&&window.EGFeatures.open)window.EGFeatures.open("quick-sale");else openSaleModal();return;}
 if(action==="add-product"){openProductModal();return;}
 if(action==="add-supplier"){openSupplierModal();return;}
 if(action==="adjust-stock"){openAdjustModal(target.dataset.id);return;}
 if(action==="export"){await exportCsv();return;}
 if(action==="export-waste"){await exportExpiryWasteCsv();return;}
 if(action==="create-po"){openPurchaseModal();return;}
 if(action==="logout"){await withBusy(target,async()=>{await api("/auth/logout",{method:"POST",body:{}});state.user=null;showAuth("login","You have signed out.");});return;}
 if(action==="alerts"){page="expiry";render();toast(state.notifications.filter(n=>!n.isRead).length+" unread notification(s).");return;}
 if(action==="save-coin-rule"){await withBusy(target,async()=>{const value=Math.floor(Number($("coinThreshold").value));if(!Number.isFinite(value)||value<1)throw new Error("Set a valid amount of at least ₹1.");const result=await api("/settings",{method:"PUT",body:{coinThreshold:value,maxAutoPurchaseAmount:state.settings.maxAutoPurchaseAmount,autoPurchaseEnabled:state.settings.autoPurchaseEnabled,timezone:state.settings.timezone}});state.settings=result.settings;await refresh();toast("Loyalty earning rule saved.");});return;}
 if(action==="reload-loyalty-rewards"){await loadLoyaltyRewards(true);return;}
 if(action==="clear-notifications"){await withBusy(target,async()=>{await api("/notifications",{method:"DELETE",body:{}});await refresh();toast("Notifications marked as read.");});return;}
 if(action==="mark-read"){await withBusy(target,async()=>{await api("/notifications/"+encodeURIComponent(target.dataset.id)+"/read",{method:"POST",body:{}});await refresh();});return;}
 if(action==="enable-notifications"){if(!("Notification" in window)){toast("This browser does not support desktop notifications.");return;}const p=await Notification.requestPermission();toast(p==="granted"?"Browser notifications enabled while the app is open.":"Notification permission was not granted.");return;}
 if(action==="record-waste"){openWasteModal(target.dataset.id);return;}
 if(action==="restore-expired"){const row=state.recycleBin.find(x=>x.id===target.dataset.id);if(!row)return;const existing=String(row.expiry||"").slice(0,10);const value=window.prompt("Only restore if the recorded expiry date was wrong. Enter the corrected valid date (YYYY-MM-DD):",existing);if(value===null)return;await withBusy(target,async()=>{await api("/recycle-bin/"+encodeURIComponent(row.id)+"/restore",{method:"POST",body:{expiryDate:value}});await refresh();toast("Product restored after expiry-date correction.");});return;}
 if(action==="delete-recycled"){if(!window.confirm("Remove this record from the recycle-bin view? Its historical record remains on the server."))return;await withBusy(target,async()=>{await api("/recycle-bin/"+encodeURIComponent(target.dataset.id),{method:"DELETE",body:{}});await refresh();toast("Recycle-bin record hidden.");});return;}
 if(action==="receive-po"){if(!window.confirm("Mark the outstanding quantities as received? This updates product stock; it does not contact the supplier."))return;await withBusy(target,async()=>{const r=await api("/purchase-orders/"+encodeURIComponent(target.dataset.id)+"/receive",{method:"POST",body:{}});await refresh();toast("Purchase receipt saved. Status: "+r.status.replaceAll("_"," ")+"."+((Array.isArray(r.warnings)&&r.warnings.length)?" "+r.warnings.length+" line(s) need attention: "+r.warnings.join(", ")+". ":""));});return;}
});
document.addEventListener("submit",async event=>{
 const form=event.target;event.preventDefault();
 if(form.id==="customerCheckoutForm"){if(storeCheckoutBusy)return;const fd=new FormData(form),submit=$("customerCheckoutButton");try{if(!customerCart.length)throw new Error("Add at least one product to the basket.");const phone=String(fd.get("phone")||"").trim();if(phone.replace(/\D/g,"").length<7)throw new Error("Enter a valid contact phone number.");storeCheckoutBusy=true;if(submit){submit.disabled=true;submit.textContent="Sending…";}customerOrderKey=customerOrderKey||newCustomerOrderKey();const result=await api("/customer/orders",{method:"POST",body:{shopSlug:customerStoreSlug,clientRequestId:customerOrderKey,name:String(fd.get("name")||"").trim(),phone,email:String(fd.get("email")||"").trim(),address:String(fd.get("address")||"").trim(),notes:String(fd.get("notes")||"").trim(),items:customerCart}});customerLastOrder=result.order;customerOrderKey=null;customerTracking=null;customerTrackError="";customerTrackQuery=null;customerTrackCheckedAt="";customerCart=[];renderCustomerPortal();toast(result.notifications?.message||"Order request sent. The shop still needs to confirm availability.");return;}catch(err){const message=String(err.message||"Could not send the order request.");toast(!err.status||/did not respond|failed to fetch|network/i.test(message)?"The request may not have reached the shop. Check with the shop before sending it again.":message);return;}finally{storeCheckoutBusy=false;const b=$("customerCheckoutButton");if(b&&b.isConnected){b.disabled=!customerCart.length;b.textContent="Send order request";}}}
 if(form.id==="customerTrackForm"){const fd=new FormData(form);await loadCustomerTracking(fd.get("reference"),fd.get("phone"));return;}
 if(form.id==="authForm"){await submitAuth(form);return;}
 if(form.id==="expiryWasteForm"){const fd=new FormData(form);await loadExpiryWasteReport(String(fd.get("from")||""),String(fd.get("to")||""));return;}
 if(form.id==="loyaltyRedeemForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form),idempotencyKey="redeem-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8),result=await api("/loyalty/redeem",{method:"POST",headers:{"Idempotency-Key":idempotencyKey},body:{customerId:String(fd.get("customerId")||""),rewardCode:String(fd.get("rewardCode")||""),idempotencyKey}});await loadLoyaltyRewards(true);await refresh();toast(result.message||("Voucher "+((result.redemption&&result.redemption.voucherCode)||"issued")+" recorded."));});return;}
 if(form.id==="wasteForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form),lossValue=String(fd.get("loss")||"").trim();await api("/recycle-bin/"+encodeURIComponent(form.dataset.id)+"/waste",{method:"POST",body:{quantity:Number(fd.get("quantity")),loss:lossValue===""?null:Number(lossValue),method:String(fd.get("method")||"").trim(),note:String(fd.get("note")||"").trim()}});$("modalRoot").innerHTML="";state.expiryWasteReport=null;await refresh();toast("Actual waste recorded. The report now separates recorded loss from the estimate.");});return;}
 if(form.id==="productForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form),payload={name:fd.get("name"),sku:fd.get("sku"),barcode:fd.get("barcode")||"",category:fd.get("category"),unit:fd.get("unit"),stock:Number(fd.get("stock")),reorderAt:Number(fd.get("reorderAt")),cost:Number(fd.get("cost")),price:Number(fd.get("price")),leadTimeDays:Number(fd.get("leadTimeDays")),expiry:fd.get("expiry")||null,trackSerials:fd.get("trackSerials")==="on"};const r=await api("/products",{method:"POST",body:payload});$("modalRoot").innerHTML="";await refresh();toast(r.recycledImmediately?r.message:"Product saved to PostgreSQL.");});return;}
 if(form.id==="editProductForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form),payload={name:fd.get("name"),sku:fd.get("sku"),barcode:fd.get("barcode")||"",category:fd.get("category"),unit:fd.get("unit"),stock:Number(fd.get("stock")),reorderAt:Number(fd.get("reorderAt")),cost:Number(fd.get("cost")),price:Number(fd.get("price")),leadTimeDays:Number(fd.get("leadTimeDays")),expiry:fd.get("expiry")||null,trackSerials:fd.get("trackSerials")==="on"};const r=await api("/products/"+encodeURIComponent(form.dataset.id),{method:"PUT",body:payload});$("modalRoot").innerHTML="";await refresh();toast(r.recycledImmediately?r.message:"Product details updated.");});return;}
 if(form.id==="saleForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);const r=await api("/sales",{method:"POST",body:{productId:fd.get("productId"),quantity:Number(fd.get("quantity")),customerName:String(fd.get("customerName")||"").trim()}});$("modalRoot").innerHTML="";await refresh();toast(r.coinsEarned>0?"Sale saved. "+r.coinsEarned+" loyalty coin(s) awarded.":"Sale saved to PostgreSQL.");});return;}
 if(form.id==="supplierForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);await api("/suppliers",{method:"POST",body:{name:fd.get("name"),contactPerson:fd.get("contactPerson"),phone:fd.get("phone"),email:fd.get("email"),categories:fd.get("categories"),leadTimeDays:Number(fd.get("leadTimeDays")),minimumOrderAmount:Number(fd.get("minimumOrderAmount"))}});$("modalRoot").innerHTML="";await refresh();toast("Supplier saved.");});return;}
 if(form.id==="adjustForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);await api("/products/"+encodeURIComponent(form.dataset.id)+"/stock-adjustments",{method:"POST",body:{delta:Number(fd.get("delta")),reason:fd.get("reason")}});$("modalRoot").innerHTML="";await refresh();toast("Stock adjustment saved with an audit notification.");});return;}
 if(form.id==="poForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const items=(state.purchasePlan.items||[]).map(p=>({productId:p.productId,quantity:p.quantity}));const r=await api("/purchase-orders",{method:"POST",body:{supplierId:form.elements.supplierId.value,items}});$("modalRoot").innerHTML="";await refresh();toast("Purchase draft created: "+r.purchaseOrder.id.slice(0,8)+". No external supplier order was sent.");});return;}
 if(form.id==="automationForm"){await withBusy(form.querySelector('[type="submit"]'),async()=>{const fd=new FormData(form);const r=await api("/settings",{method:"PUT",body:{coinThreshold:state.settings.coinThreshold,maxAutoPurchaseAmount:Number(fd.get("maxAutoPurchaseAmount")),autoPurchaseEnabled:fd.get("autoPurchaseEnabled")==="true",timezone:fd.get("timezone")}});state.settings=r.settings;await refresh();toast("Automation policy saved on the server.");});return;}
});
document.addEventListener("input",event=>{
 if(event.target.id==="customerSearch"){const pos=event.target.selectionStart;customerSearch=event.target.value;renderCustomerPortal();const next=$("customerSearch");if(next){next.focus();next.setSelectionRange(pos,pos);}}
 if(event.target.id==="globalSearch"){query=event.target.value;page="inventory";render();const input=$("inventorySearch");if(input){input.value=query;input.focus();input.setSelectionRange(query.length,query.length);}}
 if(event.target.id==="inventorySearch"){query=event.target.value;const pos=event.target.selectionStart;render();const input=$("inventorySearch");if(input){input.focus();input.setSelectionRange(pos,pos);}}
 if(event.target.closest("#saleForm")&&(event.target.id==="saleQuantity"||event.target.name==="customerName"))updateSalePreview();
 if(event.target.id==="coinThreshold"){const preview=document.querySelector(".example-card .coin-value"),v=Math.floor(Number(event.target.value)||1);if(preview)preview.textContent=Math.floor(499/Math.max(v,1))+" ◆";}
});
document.addEventListener("change",event=>{if(event.target.id==="saleProduct")updateSalePreview();});
document.addEventListener("keydown",event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){event.preventDefault();$("globalSearch").focus();}if(event.key==="Escape")$("modalRoot").innerHTML="";});
async function pollNotifications(){
 if(!state.user||document.hidden)return;
 try{
  const result=await api("/notifications");
  for(const n of result.notifications){if(!knownNotifications.has(n.id)){knownNotifications.add(n.id);if(n.kind==="product_expired"){toast(n.message);if("Notification" in window&&Notification.permission==="granted"){try{new Notification("Easy Gateway: expiry alert",{body:n.message});}catch(_){}}}}}
  state.notifications=result.notifications;
  if(page==="expiry")render();
 }catch(err){if(err.status===401){state.user=null;showAuth("login","Your session expired. Please sign in again.");}}
}
function navigate(next){page=next;query="";if(page==="waste"){state.expiryWasteReport=null;state.expiryWasteError="";}render();if(page==="waste")loadExpiryWasteReport();if(page==="loyalty")loadLoyaltyRewards();}
function openProductModalWithBarcode(code){openProductModal();const f=$("productForm");if(f&&f.elements.barcode&&code)f.elements.barcode.value=code;}
window.EGApp={api,toast,state,refresh,loadDemoData,saveDemoData,render,navigate,fmt,num,safe,localDate,dateLabel,openProductModal,openProductModalWithBarcode,get demoMode(){return demoMode;},nativeShare,scanBarcode:scanQrCode,isNativeApp};
start();
window.setInterval(pollNotifications,60000);
window.setInterval(pollQrTokenStatus,2500);
})();
